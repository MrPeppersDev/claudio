<!DOCTYPE html>
<!--
  rsvp.html — single-word RSVP display for Claudio balloon.

  Loaded by rsvp.lua into an hs.webview. Lua drives it via evaluateJavaScript:
    window.rsvpLoad(sidecar_json_string)   -- parse + store sidecar
    window.rsvpShowAt(ms)                  -- render word at playhead position
    window.rsvpPause()                     -- show pause indicator
    window.rsvpResume()                    -- remove pause indicator
    window.rsvpFadeOut()                   -- fade to 0 opacity (~300ms)

  Design notes (from a pass through frontend-design + editorial-designer
  + ui-humanizer skills):

    * Design tokens live in :root so the palette, radii, and motion
      vocabulary are one place instead of 12. Adjust there, everywhere
      inherits.
    * Monochrome surface with ONE accent color on the fixation anchor
      letter only. Progress bar uses a neutral ink tone so the anchor
      stays the only place color is "talking back" visually. A graded
      opacity / warmth-gradient variant was tried and removed — no
      peer-reviewed work from 2021-2026 validates graded-emphasis
      treatments for RSVP. Snell & Grainger 2021 showed parafoveal
      preview is suppressed in RSVP, so edge-graded treatments have no
      theoretical basis either. Single anchor char is the research-
      safe default.
    * Motion uses a single easing and two durations (fast / slow).
    * prefers-reduced-motion disables all transitions — the balloon is
      primarily a reading aid and flash-animation motion is the thing
      motion-sensitive users need disabled most.
    * Long words (e.g. "accommodations") would overflow at 60px fixed.
      Size clamps responsively with min 36px so the widest realistic
      English word still fits a 460px inner area.

  Fixation-anchor rule — Optimal Viewing Position (OVP):

    Background: psycholinguistics has known since the 1980s that the eye
    prefers to land slightly left of a word's geometric center when
    reading — the "Optimal Viewing Position" or OVP (O'Regan 1981,
    Rayner 1998, Vitu et al. 2001). The anchor letter is positioned
    there and held at a fixed screen coordinate across every word so
    the eye doesn't have to re-fixate per flash.

    Our rule (research-direct, not the arithmetic heuristic used in
    commercial RSVP tooling):

      1. Take L = length(word) after stripping trailing punctuation.
      2. baseline = round(0.40 · L)          (OVP bias, leftward of
         geometric center).  Clamped to [1, L-2] so the anchor never
         sits on an edge character.
      3. Snap to the nearest vowel within ±1 of baseline; otherwise
         keep the baseline.  Fixations cluster on syllable nuclei,
         which in English are overwhelmingly vowel-carried.
      4. For high-frequency words (a small embedded set of the ~40
         most frequent English function words), shift the anchor +1
         to the right.  Parker et al. (2023, Applied Cognitive
         Psychology) found OVP is frequency-dependent: common words
         tolerate a slightly rightward landing position, rare/long
         words want the anchor biased left.

    The 40% proportion is the leftward-OVP consensus from the
    psycholinguistic literature (O'Regan 1981; Rayner 1998; Vitu,
    O'Regan & Mittau 2001) and predates every commercial RSVP tool.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    /* Surface */
    --cream:      #F6EFDC;
    --cream-2:    #F1E8CE;   /* deeper cream for subtle inner edge */

    /* Ink */
    --ink:        #1A1613;
    --ink-soft:   rgba(60, 42, 18, 0.55);
    --ink-faint:  rgba(60, 42, 18, 0.10);

    /* Single accent */
    --accent:     #B23A2B;   /* book-red, dialed in for AA on cream */

    /* Shape */
    --radius:     14px;

    /* Motion */
    --ease:       cubic-bezier(0.4, 0, 0.2, 1);
    --dur-fast:   160ms;
    --dur-slow:   300ms;

    /* Type */
    --font-stack: "SF Pro Text", -apple-system, BlinkMacSystemFont,
                  "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    font-family: var(--font-stack);
    font-feature-settings: "ss01", "cv11", "tnum";
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    opacity: 0;
    transition: opacity 220ms var(--ease);
    outline: none;
  }

  /*
    Balloon: warm book-page cream on a layered, warmth-tinted shadow.
    inset:8px reserves room around the edge so the shadow doesn't clip
    against the transparent webview frame. Inner 1px stroke gives the
    edge definition enterprise surfaces rely on without looking
    like a button.
  */
  #balloon {
    position: absolute;
    inset: 8px;
    background: var(--cream);
    border-radius: var(--radius);
    box-shadow:
      0 1px 2px   rgba(28, 20, 8, 0.06),
      0 10px 22px rgba(28, 20, 8, 0.14),
      0 28px 56px rgba(28, 20, 8, 0.10),
      inset 0 0 0 1px rgba(60, 42, 18, 0.09),
      inset 0 -1px 0 0 rgba(120, 90, 40, 0.05);
    overflow: hidden;
  }

  /*
    Word area fills the entire balloon — no explicit status strip.
    The progress indicator floats as an atmospheric hairline at the
    very bottom; the pause indicator is a tiny dot, top-right.
    "Less interface, more atmosphere" per the editorial-designer skill.
  */
  #word-area {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
  }

  /*
    RSVP fixation-stable layout.

    The fixation anchor only works as a reading accelerator if the
    anchor character stays at one fixed screen coordinate across every
    word. If it drifts — even by a few pixels — the eye has to re-
    fixate for every flash and the technique collapses into "read the
    whole word" again, which is slower than normal reading.

    Grid columns with fixed ratios guarantee the middle column's x-range
    is invariant regardless of word length or glyph widths:

      ┌──────── 1fr ────────┬── 0.9em ──┬──────── 1.5fr ──────────┐
      │  word-left (rt-al)  │  anchor   │   word-right (lf-al)    │
      └─────────────────────┴───────────┴─────────────────────────┘
                            ▲
                        locked here

    Anchor column is sized in em (scales with font-size) and wide enough
    for any glyph, so narrow "i" and wide "W" both center identically
    within the same pixel range.

    1 : 1.5 fr ratio places the anchor at ~40% of the row width —
    consistent with the leftward OVP bias in the psycholinguistic
    literature (eye lands ~40-45% into the word for optimal processing).
  */
  #balloon { container-type: inline-size; }

  #word-row {
    display: grid;
    grid-template-columns: 1fr 0.9em 1.5fr;
    align-items: baseline;
    width: 100%;
    max-width: 460px;
    font-size: clamp(36px, 8.2cqw, 60px);
    line-height: 1.0;
    letter-spacing: -0.015em;
  }

  #word-left,
  #word-anchor,
  #word-right {
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
  }

  #word-left   { text-align: right;  padding-right: 0.06em; }
  #word-anchor {
    text-align: center;
    color: var(--accent);
    font-weight: 600;
  }
  #word-right  { text-align: left;   padding-left:  0.06em; }

  /*
    Progress hairline: 2px along the very bottom edge, INSIDE the
    border-radius, inset from each corner so the fill bar doesn't
    ever touch the rounded edge. Neutral ink tint, not red — the
    fixation zone is the only place the accent color speaks.
  */
  #progress-track {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 12px;
    height: 2px;
    background: var(--ink-faint);
    border-radius: 1px;
    overflow: hidden;
  }

  #progress-fill {
    height: 100%;
    width: 0%;
    background: rgba(26, 22, 19, 0.32);   /* ink at ~32% */
    transition: width 200ms linear;
  }

  /*
    Pause indicator: a tiny 6px dot in the top-right, using the accent
    (this is the one place outside the fixation zone where red appears —
    permissible because pause is a stopped-state and the same semantic
    "attention" cue is appropriate). Hidden by default.
  */
  #pause-dot {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transition: opacity var(--dur-fast) var(--ease);
  }

  body.paused #word-row {
    opacity: 0.40;
    transition: opacity var(--dur-fast) var(--ease);
  }
  body.paused #pause-dot {
    opacity: 1;
  }

  /*
    Hover-revealed control bar. Centered along the bottom, above the
    progress hairline. Invisible until the pointer enters the balloon,
    then fades in. Buttons dispatch into window.__claudio_q — a plain
    JS array that Lua polls via evaluateJavaScript every ~80 ms.
  */
  #controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-fast) var(--ease);
  }
  #balloon:hover #controls { opacity: 1; pointer-events: auto; }
  body.paused #controls   { opacity: 1; pointer-events: auto; }

  #controls button {
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid rgba(60, 42, 18, 0.18);
    background: rgba(246, 239, 220, 0.82);
    color: var(--ink);
    font-family: var(--font-stack);
    font-size: 14px;
    line-height: 1;
    padding: 6px 10px;
    min-width: 34px;
    border-radius: 8px;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease),
                transform var(--dur-fast) var(--ease);
  }
  #controls button:hover  { background: rgba(241, 232, 206, 0.95); }
  #controls button:active { transform: translateY(1px); }

  /*
    Respect user's motion preferences. The balloon is a reading aid;
    animated fades and progress-bar tweening are precisely the motions
    a motion-sensitive user needs quieted. Kill durations to near-zero
    rather than 0 so the JS doesn't break on unresolved transitions.
  */
  @media (prefers-reduced-motion: reduce) {
    body,
    body.paused #word-row,
    #pause-dot,
    #progress-fill {
      transition-duration: 1ms !important;
    }
  }
</style>
</head>
<body tabindex="-1">
<div id="balloon">
  <div id="word-area">
    <div id="word-row">
      <span id="word-left"></span>
      <span id="word-anchor"></span>
      <span id="word-right"></span>
    </div>
  </div>
  <div id="pause-dot"></div>
  <div id="controls">
    <button id="btn-back"  type="button" aria-label="Back">&#x2190;</button>
    <button id="btn-pause" type="button" aria-label="Pause">&#x23F8;</button>
    <button id="btn-fwd"   type="button" aria-label="Forward">&#x2192;</button>
    <button id="btn-close" type="button" aria-label="Close">&#x2715;</button>
  </div>
  <div id="progress-track"><div id="progress-fill"></div></div>
</div>

<script>
"use strict";

// ── State ────────────────────────────────────────────────────────────────────

var _sidecar = null;
var _currentWordIdx = -1;
var _paused = false;

var _bufferSidecars = {};
var _currentBufferId = null;

// ── Clause-boundary hold ────────────────────────────────────────────────────
//
// Above ~300 wpm, comprehension of the inferential layer (implications,
// not just recall) degrades — loss of re-reading opportunity is the
// primary driver (Snell 2024; Computers & Education 2024). A brief
// additional hold at clause-ending punctuation gives the reader time
// to consolidate the clause before the next one flashes.
//
// 60 ms is below the 100 ms audio-lead tolerance (Kim et al. 2024) so
// the resulting visual-lags-audio during the hold is within the safe
// window.  Applied at most once per punctuation-ending word via the
// _punctHoldArmedForIdx sentinel.

var CLAUSE_HOLD_MS = 60;
var _PUNCT_ENDING = /[,.;:?!]\s*$/;
var _holdReleaseAt = 0;          // performance.now() after which we may advance
var _punctHoldArmedForIdx = -1;  // _currentWordIdx for which hold already fired

// ── OVP (Optimal Viewing Position) helpers ──────────────────────────────────

function stripTrailingPunct(s) {
  return s.replace(/[.,!?:;"'\)\]}’”]+$/, "");
}

var _VOWELS = /[aeiouy]/i;

// Embedded common-word set for the frequency-tier OVP shift (Parker et al.
// 2023). Top ~40 most-frequent English function words by BNC/SUBTLEX-US.
// Intentionally small: these cover ~35-40% of running-text tokens and are
// where the rightward-shift effect is strongest. A larger wordlist would
// bloat this file without meaningful marginal benefit for RSVP pacing.
var _COMMON_WORDS = (function () {
  var words = (
    "the of and a to in is it you that he was for on are with as i his " +
    "they be at this have from or one had by word but not what all were " +
    "we when your can said there use an each which she do how their if"
  ).split(" ");
  var set = Object.create(null);
  for (var i = 0; i < words.length; i++) set[words[i]] = true;
  return set;
})();

function isCommonWord(stripped) {
  return _COMMON_WORDS[stripped.toLowerCase()] === true;
}

/**
 * Return the 0-based index of the OVP anchor character in `word`.
 *
 * Algorithm:
 *   1. baseline = round(0.40 · L), clamped to [1, L-2].
 *   2. Snap to nearest vowel within ±1; else keep baseline.
 *   3. If the word is in the common-word set, shift +1 right
 *      (Parker et al. 2023: frequent words tolerate a later landing
 *      position than rare ones).
 *
 * 0.40 is the leftward-OVP consensus from O'Regan 1981 / Rayner 1998 /
 * Vitu et al. 2001 — pre-Spritz, pre-Bionic, unencumbered prior art.
 */
function anchorIndex(word) {
  var stripped = stripTrailingPunct(word);
  var L = stripped.length;
  if (L <= 1) return 0;
  if (L === 2) return 0;

  var baseline = Math.round(0.40 * L);
  baseline = Math.max(1, Math.min(L - 2, baseline));

  // Vowel snap: check baseline, then ±1. First hit wins.
  var idx = baseline;
  var offsets = [0, -1, 1];
  for (var k = 0; k < offsets.length; k++) {
    var probe = baseline + offsets[k];
    if (probe < 1 || probe > L - 2) continue;
    if (_VOWELS.test(stripped.charAt(probe))) { idx = probe; break; }
  }

  // Frequency-tier shift: common words → anchor one char later.
  if (isCommonWord(stripped) && idx + 1 <= L - 2) {
    idx += 1;
  }

  return idx;
}

// ── Rendering ────────────────────────────────────────────────────────────────

function renderWord(word) {
  var leftEl   = document.getElementById("word-left");
  var anchorEl = document.getElementById("word-anchor");
  var rightEl  = document.getElementById("word-right");

  // textContent, never innerHTML — sidecar text comes from user-provided
  // source material and must not reach the HTML parser.
  if (!word) {
    leftEl.textContent   = "";
    anchorEl.textContent = "";
    rightEl.textContent  = "";
    return;
  }

  var idx = anchorIndex(word);
  leftEl.textContent   = word.substring(0, idx);
  anchorEl.textContent = word.substring(idx, idx + 1);
  rightEl.textContent  = word.substring(idx + 1);
}

function updateProgress(ms, words) {
  if (!words || words.length === 0) return;
  var lastEnd = words[words.length - 1].end_ms;
  if (!lastEnd || lastEnd <= 0) return;
  var pct = Math.max(0, Math.min(100, (ms / lastEnd) * 100));
  document.getElementById("progress-fill").style.width = pct + "%";
}

// ── Sidecar binary search ────────────────────────────────────────────────────

function wordIndexAt(words, ms) {
  if (!words || words.length === 0) return -1;
  var lo = 0, hi = words.length - 1;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    var w = words[mid];
    if (ms < w.start_ms) {
      hi = mid - 1;
    } else if (ms >= w.end_ms) {
      lo = mid + 1;
    } else {
      return mid;
    }
  }
  if (lo < words.length) return lo;
  return -1;
}

// ── Public JS API (called by Lua via evaluateJavaScript) ─────────────────────

window.rsvpLoad = function(jsonString) {
  try {
    _sidecar = JSON.parse(jsonString);
    _currentWordIdx = -1;
    _currentBufferId = null;
    _holdReleaseAt = 0;
    _punctHoldArmedForIdx = -1;
    renderWord("");
    document.getElementById("progress-fill").style.width = "0%";
  } catch(e) {
    console.error("rsvpLoad: parse error", e);
  }
};

window.rsvpLoadBuffer = function(bufferId, jsonString) {
  try {
    _bufferSidecars[bufferId] = JSON.parse(jsonString);
  } catch(e) {
    console.error("rsvpLoadBuffer: parse error for buffer", bufferId, e);
  }
};

window.rsvpShowAt = function(ms, bufferId) {
  if (_paused) return;

  var words;
  if (bufferId != null && _bufferSidecars[bufferId]) {
    words = _bufferSidecars[bufferId].words;
    if (bufferId !== _currentBufferId) {
      // New sentence buffer: reset advance state so an index from the
      // previous buffer can't leak into the new words array (punct-hold
      // gating reads words[_currentWordIdx] by index).
      _currentWordIdx = -1;
      _holdReleaseAt = 0;
      _punctHoldArmedForIdx = -1;
      _currentBufferId = bufferId;
    }
  } else if (_sidecar) {
    words = _sidecar.words;
  } else {
    return;
  }

  updateProgress(ms, words);

  // Clause-boundary hold: if we armed one, freeze the display until it
  // releases. The progress bar keeps ticking underneath — that's the
  // "something is happening" cue while the word stays put.
  if (performance.now() < _holdReleaseAt) return;

  var idx = wordIndexAt(words, ms);
  if (idx === _currentWordIdx) return;

  // About to advance past a word. If the word we're leaving ended in
  // clause-boundary punctuation and we haven't yet held for it, arm the
  // hold and bail — the visual stays on the punctuation word while the
  // caller's POS events continue to arrive and advance time.
  if (_currentWordIdx >= 0 &&
      _punctHoldArmedForIdx !== _currentWordIdx &&
      words[_currentWordIdx] &&
      _PUNCT_ENDING.test(words[_currentWordIdx].text || "")) {
    _punctHoldArmedForIdx = _currentWordIdx;
    _holdReleaseAt = performance.now() + CLAUSE_HOLD_MS;
    return;
  }

  _currentWordIdx = idx;
  if (idx >= 0) {
    renderWord(words[idx].text);
  }
};

window.rsvpPause = function() {
  _paused = true;
  document.body.classList.add("paused");
  var btn = document.getElementById("btn-pause");
  if (btn) { btn.innerHTML = "&#x25B6;"; btn.setAttribute("aria-label", "Resume"); }
};

window.rsvpResume = function() {
  _paused = false;
  document.body.classList.remove("paused");
  var btn = document.getElementById("btn-pause");
  if (btn) { btn.innerHTML = "&#x23F8;"; btn.setAttribute("aria-label", "Pause"); }
};

window.rsvpFadeOut = function() {
  document.body.style.transition = "opacity 300ms cubic-bezier(0.4, 0, 0.2, 1)";
  document.body.style.opacity = "0";
};

window.rsvpFadeIn = function() {
  document.body.style.transition = "opacity 180ms cubic-bezier(0.4, 0, 0.2, 1)";
  document.body.style.opacity = "1";
};

// ── Lua bridge: command queue ───────────────────────────────────────────────
//
// Buttons push command strings here; Lua polls this array every ~80 ms via
// evaluateJavaScript, drains it, and dispatches. A plain array + polling is
// used instead of a custom URL scheme because WKWebView swallows unknown-
// scheme navigation silently (tried rsvp:// — navigationCallback either
// doesn't fire for it or fires too late to block the load).

window.__claudio_q = [];
function __claudio_push(cmd) { window.__claudio_q.push(cmd); }

(function wireButtons() {
  var b = document.getElementById("btn-back");
  var p = document.getElementById("btn-pause");
  var f = document.getElementById("btn-fwd");
  var x = document.getElementById("btn-close");
  if (b) b.addEventListener("click", function(e) { e.preventDefault(); __claudio_push("seek_back"); });
  if (p) p.addEventListener("click", function(e) { e.preventDefault(); __claudio_push("toggle_pause"); });
  if (f) f.addEventListener("click", function(e) { e.preventDefault(); __claudio_push("seek_fwd"); });
  if (x) x.addEventListener("click", function(e) { e.preventDefault(); __claudio_push("close"); });
})();

// Keyboard shortcuts via window-level keydown. Scope is the webview content
// — keys only flow here while the body has focus. Body has tabindex=-1 so
// it's programmatically focusable; we focus on mousedown anywhere in the
// document so any click on the balloon (button or empty area) puts the
// keyboard in this webview. Without that, allowTextEntry alone doesn't
// transfer keyboard focus on click — clicks land on the webview but no
// document element gets focus, and document-level keydown never fires.
document.addEventListener("mousedown", function() {
  document.body.focus();
});
window.addEventListener("keydown", function(e) {
  var k = e.key;
  if (k === " " || e.code === "Space") {
    e.preventDefault();
    __claudio_push("toggle_pause");
  } else if (k === "Escape") {
    e.preventDefault();
    __claudio_push("pause_only");
  } else if (k === "ArrowLeft") {
    e.preventDefault();
    __claudio_push("seek_back");
  } else if (k === "ArrowRight") {
    e.preventDefault();
    __claudio_push("seek_fwd");
  }
});

// ── Init ─────────────────────────────────────────────────────────────────────

renderWord("—");
</script>
</body>
</html>
