<!DOCTYPE html>
<!--
  rsvp.html — single-word RSVP display for Claudio balloon.

  Loaded by rsvp.lua into an hs.webview. Lua drives it via evaluateJavaScript:
    window.rsvpLoad(sidecar_json_string)   -- parse + store sidecar
    window.rsvpShowAt(ms)                  -- render word at playhead position
    window.rsvpPause()                     -- show pause indicator
    window.rsvpResume()                    -- remove pause indicator
    window.rsvpFadeOut()                   -- fade to 0 opacity (~300ms)

  Layout model (what changed from earlier versions):
    The word is rendered as a single text-aligned line — the ORP pivot
    character is colored red for fixation, but the whole word is visually
    centered. The prior fixed-pivot-column approach was technically correct
    Spritz-style RSVP but made long words feel visually off-balance in a
    wide bubble. Horizontal balance reads as more polished, and the color
    cue still signals the fixation point without geometric anchoring.

  ORP (Optimal Recognition Point) heuristic:
    Strip trailing punctuation for length calculation.
    pivot_index = min(max(1, ceil((L-1)/4)), L-1)   (1-based)
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    /*
      Font stack optimized for fast reading:
      SF Pro Text is Apple's reading-optimized companion to SF Pro Display —
      open counters, unambiguous i/l/1, tuned for mid-size rendering.
      Fallbacks cover older macOS and custom-font-blocked renderers.
    */
    font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont,
                 "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-feature-settings: "ss01", "cv11", "tnum";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: opacity 220ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  /*
    Balloon: warm book-page cream with a refined, layered shadow.
    The double-shadow creates soft ambient depth without a heavy drop
    shadow. 1px inner stroke gives the edge definition that enterprise
    surfaces (Linear, Notion, Vercel) use to avoid looking flat.
  */
  #balloon {
    position: absolute;
    inset: 8px;                         /* outer margin for shadow spread */
    background: #F6EFDC;                /* book-page cream */
    border-radius: 14px;
    box-shadow:
      0 1px 2px   rgba(28, 22, 10, 0.06),
      0 8px 20px  rgba(28, 22, 10, 0.14),
      0 24px 48px rgba(28, 22, 10, 0.08),
      inset 0 0 0 1px rgba(60, 42, 18, 0.08);
    display: grid;
    grid-template-rows: 1fr auto;       /* word area + status strip */
  }

  /*
    Word area: full-bleed single row, contents centered.
    The word is ONE horizontally-centered block. Pivot coloring is done
    inline via nested spans, not flex columns — so a long word and a
    short word both sit at the optical center of the bubble.
  */
  #word-area {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 32px;
    min-width: 0;
    overflow: hidden;
  }

  #word {
    font-size: 60px;
    font-weight: 500;
    line-height: 1.0;
    letter-spacing: -0.015em;
    color: #1A1613;                     /* warm near-black */
    white-space: nowrap;
    text-align: center;
  }

  #word .pivot {
    color: #B23A2B;                     /* book-red, dialed down from pure red */
    font-weight: 600;
  }

  /*
    Status strip: hairline row along the bottom. Carries the progress
    bar and an optional state label. 26px keeps it visible without
    dominating the word area.
  */
  #status {
    position: relative;
    height: 26px;
    border-top: 1px solid rgba(60, 42, 18, 0.10);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #progress-track {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: rgba(60, 42, 18, 0.06);
  }

  #progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
      rgba(178, 58, 43, 0.55),
      rgba(178, 58, 43, 0.85));
    transition: width 180ms linear;
    border-radius: 0 1px 1px 0;
  }

  #status-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(60, 42, 18, 0.45);
    font-feature-settings: "tnum";
    user-select: none;
    visibility: hidden;                 /* shown only when paused */
  }

  /* Paused state */
  body.paused #word {
    opacity: 0.38;
    transition: opacity 160ms ease-out;
  }
  body.paused #status-label {
    visibility: visible;
  }

  /* Initial invisible state — Lua calls rsvpFadeIn once the frame is placed */
  body {
    opacity: 0;
  }
</style>
</head>
<body>
<div id="balloon">
  <div id="word-area">
    <div id="word"></div>
  </div>
  <div id="status">
    <span id="status-label">paused</span>
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>
</div>

<script>
"use strict";

// ── State ────────────────────────────────────────────────────────────────────

var _sidecar = null;
var _currentWordIdx = -1;
var _paused = false;

var _bufferSidecars = {};
var _currentBufferId = null;

// ── ORP helpers ──────────────────────────────────────────────────────────────

function stripTrailingPunct(s) {
  return s.replace(/[.,!?:;"'\)\]}’”]+$/, "");
}

function orpIndex(word) {
  var stripped = stripTrailingPunct(word);
  var L = stripped.length;
  if (L <= 1) return 0;
  var idx1 = Math.min(Math.max(1, Math.ceil((L - 1) / 4)), L - 1);
  return idx1 - 1;
}

// ── Rendering ────────────────────────────────────────────────────────────────

function renderWord(word) {
  var el = document.getElementById("word");
  if (!word || word === "") {
    el.textContent = "";
    return;
  }
  var pivot = orpIndex(word);
  var before = word.substring(0, pivot);
  var pivotChar = word.substring(pivot, pivot + 1);
  var after = word.substring(pivot + 1);

  // Build DOM via textContent on spans (not innerHTML) — text may contain
  // characters that would be interpreted as markup, and we never want
  // sidecar-fed content to reach the HTML parser.
  el.textContent = "";
  if (before) {
    var b = document.createElement("span");
    b.textContent = before;
    el.appendChild(b);
  }
  if (pivotChar) {
    var p = document.createElement("span");
    p.className = "pivot";
    p.textContent = pivotChar;
    el.appendChild(p);
  }
  if (after) {
    var a = document.createElement("span");
    a.textContent = after;
    el.appendChild(a);
  }
}

function updateProgress(ms, words) {
  if (!words || words.length === 0) return;
  var lastEnd = words[words.length - 1].end_ms;
  if (!lastEnd || lastEnd <= 0) return;
  var pct = Math.max(0, Math.min(100, (ms / lastEnd) * 100));
  document.getElementById("progress-fill").style.width = pct + "%";
}

// ── Sidecar binary search ────────────────────────────────────────────────────

function wordIndexAt(words, ms) {
  if (!words || words.length === 0) return -1;
  var lo = 0, hi = words.length - 1;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    var w = words[mid];
    if (ms < w.start_ms) {
      hi = mid - 1;
    } else if (ms >= w.end_ms) {
      lo = mid + 1;
    } else {
      return mid;
    }
  }
  if (lo < words.length) return lo;
  return -1;
}

// ── Public JS API (called by Lua via evaluateJavaScript) ─────────────────────

window.rsvpLoad = function(jsonString) {
  try {
    _sidecar = JSON.parse(jsonString);
    _currentWordIdx = -1;
    _currentBufferId = null;
    renderWord("");
    document.getElementById("progress-fill").style.width = "0%";
  } catch(e) {
    console.error("rsvpLoad: parse error", e);
  }
};

window.rsvpLoadBuffer = function(bufferId, jsonString) {
  try {
    _bufferSidecars[bufferId] = JSON.parse(jsonString);
  } catch(e) {
    console.error("rsvpLoadBuffer: parse error for buffer", bufferId, e);
  }
};

window.rsvpShowAt = function(ms, bufferId) {
  if (_paused) return;

  var words;
  if (bufferId != null && _bufferSidecars[bufferId]) {
    words = _bufferSidecars[bufferId].words;
    _currentBufferId = bufferId;
  } else if (_sidecar) {
    words = _sidecar.words;
  } else {
    return;
  }

  updateProgress(ms, words);

  var idx = wordIndexAt(words, ms);
  if (idx === _currentWordIdx) return;
  _currentWordIdx = idx;

  if (idx >= 0) {
    renderWord(words[idx].text);
  }
};

window.rsvpPause = function() {
  _paused = true;
  document.body.classList.add("paused");
};

window.rsvpResume = function() {
  _paused = false;
  document.body.classList.remove("paused");
};

window.rsvpFadeOut = function() {
  document.body.style.transition = "opacity 300ms cubic-bezier(0.4, 0, 0.2, 1)";
  document.body.style.opacity = "0";
};

window.rsvpFadeIn = function() {
  document.body.style.transition = "opacity 180ms cubic-bezier(0.4, 0, 0.2, 1)";
  document.body.style.opacity = "1";
};

// ── Init ─────────────────────────────────────────────────────────────────────

renderWord("—");
</script>
</body>
</html>
