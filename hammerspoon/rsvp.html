<!DOCTYPE html>
<!--
  rsvp.html — single-word RSVP display for Claudio balloon.

  Loaded by rsvp.lua into an hs.webview. Lua drives it via evaluateJavaScript:
    window.rsvpLoad(sidecar_json_string)   -- parse + store sidecar
    window.rsvpShowAt(ms)                  -- render word at playhead position
    window.rsvpPause()                     -- show pause indicator
    window.rsvpResume()                    -- remove pause indicator
    window.rsvpFadeOut()                   -- fade to 0 opacity (~300ms)

  ORP (Optimal Recognition Point) heuristic (Spritz-style):
    Strip trailing punctuation for length calculation.
    pivot_index = min(max(1, ceil((L-1)/4)), L-1)   (1-based)
    The pivot character is rendered in red; the full word including
    punctuation is displayed. The ORP pivot is anchored at the horizontal
    center of the balloon so the eye doesn't have to hunt for it between
    words of different lengths.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    /*
      Font stack for high-speed reading:
      SF Pro Text is Apple's default reading-optimized font — open counters,
      clear i/l/1 distinctions, excellent rendering at mid-sizes. Fallbacks
      cover older macOS, custom-font-blocked renderers, and edge cases.
    */
    font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont,
                 "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-feature-settings: "ss01", "cv11";   /* flat 6/9 and straight ℓ in SF */
    -webkit-font-smoothing: antialiased;
    transition: opacity 0.3s ease-out;
  }

  /*
    Balloon: warm off-white like a book page, soft drop shadow so it
    floats above the desktop without needing a hard border. Rounded enough
    to feel like a speech bubble, not a window.
  */
  #balloon {
    position: relative;
    width: 100%;
    height: 100%;
    background: #F5EEDB;           /* book-page cream */
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 12px 32px rgba(30, 20, 10, 0.18),
      0 2px 6px  rgba(30, 20, 10, 0.10),
      inset 0 0 0 1px rgba(120, 90, 40, 0.08);
    gap: 6px;
  }

  /*
    Word display — three-column flex row with the pivot at dead center.
    word-left and word-right are equal-weight flex children so the pivot
    column is always horizontally centered no matter the word length.
  */
  #word-row {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    width: 92%;
    max-width: 460px;
  }

  #word-left {
    flex: 1 1 0;              /* grow/shrink equally with word-right */
    text-align: right;
    font-size: 56px;
    font-weight: 500;
    color: #1A1A1A;           /* near-black */
    letter-spacing: -0.3px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
  }

  #word-pivot {
    flex: 0 0 auto;           /* size to content; the pivot is one glyph */
    min-width: 0.6em;         /* keep a visual anchor for narrow glyphs (i, l) */
    text-align: center;
    font-size: 56px;
    font-weight: 600;
    color: #C0392B;           /* rich book-red */
    letter-spacing: -0.3px;
    line-height: 1.1;
    white-space: nowrap;
  }

  #word-right {
    flex: 1 1 0;              /* mirrors word-left */
    text-align: left;
    font-size: 56px;
    font-weight: 500;
    color: #1A1A1A;
    letter-spacing: -0.3px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
  }

  /*
    Vertical ORP guide — faint red line down the pivot column. Helps the
    eye lock onto the fixation point without being visually noisy.
  */
  #orp-guide {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 14%;
    bottom: 14%;
    width: 1px;
    background: rgba(192, 57, 43, 0.18);
    pointer-events: none;
  }

  /* Pause overlay */
  #pause-indicator {
    display: none;
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    color: rgba(80, 60, 30, 0.55);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* Dim the word slightly when paused */
  body.paused #word-left,
  body.paused #word-right,
  body.paused #word-pivot {
    opacity: 0.38;
  }
  body.paused #pause-indicator {
    display: block;
  }

  /* Initial invisible state — Lua calls rsvpFadeIn after the open animation */
  body {
    opacity: 0;
  }
</style>
</head>
<body>
<div id="balloon">
  <div id="orp-guide"></div>
  <div id="word-row">
    <span id="word-left"></span>
    <span id="word-pivot"></span>
    <span id="word-right"></span>
  </div>
  <div id="pause-indicator">paused</div>
</div>

<script>
"use strict";

// ── State ────────────────────────────────────────────────────────────────────

var _sidecar = null;          // parsed sidecar JSON (words array)
var _currentWordIdx = -1;     // index into _sidecar.words of the current word
var _paused = false;

// Buffer-id → sidecar map (for multi-buffer sessions fed by PR 4)
var _bufferSidecars = {};
var _currentBufferId = null;

// ── ORP helpers ──────────────────────────────────────────────────────────────

/**
 * Strip trailing punctuation characters from a string for length calculation.
 * The characters we strip: . , ! ? : ; " ' ) ] }
 */
function stripTrailingPunct(s) {
  return s.replace(/[.,!?:;"'\)\]}’”]+$/, "");
}

/**
 * Compute the 0-based ORP pivot index for a word string.
 * Uses the stripped form for length, but the pivot maps into the *full* string.
 *
 * Heuristic: pivot_index (1-based) = min(max(1, ceil((L-1)/4)), L-1)
 *            where L = stripped word length
 * Returns 0-based index into the full word string.
 */
function orpIndex(word) {
  var stripped = stripTrailingPunct(word);
  var L = stripped.length;
  if (L === 0) return 0;
  if (L === 1) return 0;
  var idx1 = Math.min(Math.max(1, Math.ceil((L - 1) / 4)), L - 1);
  return idx1 - 1;
}

// ── Word rendering ───────────────────────────────────────────────────────────

function renderWord(word) {
  if (!word || word === "") {
    document.getElementById("word-left").textContent  = "";
    document.getElementById("word-pivot").textContent = "";
    document.getElementById("word-right").textContent = "";
    return;
  }

  var pivot = orpIndex(word);

  var before = word.substring(0, pivot);
  var pivotChar = word.substring(pivot, pivot + 1);
  var after = word.substring(pivot + 1);

  document.getElementById("word-left").textContent  = before;
  document.getElementById("word-pivot").textContent = pivotChar;
  document.getElementById("word-right").textContent = after;
}

// ── Sidecar binary search ────────────────────────────────────────────────────

/**
 * Find the index of the word whose [start_ms, end_ms) range contains `ms`.
 * Returns -1 if no word covers `ms`.
 */
function wordIndexAt(words, ms) {
  if (!words || words.length === 0) return -1;
  var lo = 0, hi = words.length - 1;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    var w = words[mid];
    if (ms < w.start_ms) {
      hi = mid - 1;
    } else if (ms >= w.end_ms) {
      lo = mid + 1;
    } else {
      return mid;
    }
  }
  if (lo < words.length) return lo;
  return -1;
}

// ── Public JS API (called by Lua via evaluateJavaScript) ─────────────────────

window.rsvpLoad = function(jsonString) {
  try {
    _sidecar = JSON.parse(jsonString);
    _currentWordIdx = -1;
    _currentBufferId = null;
    renderWord("");
  } catch(e) {
    console.error("rsvpLoad: parse error", e);
  }
};

window.rsvpLoadBuffer = function(bufferId, jsonString) {
  try {
    _bufferSidecars[bufferId] = JSON.parse(jsonString);
  } catch(e) {
    console.error("rsvpLoadBuffer: parse error for buffer", bufferId, e);
  }
};

window.rsvpShowAt = function(ms, bufferId) {
  if (_paused) return;

  var words;
  if (bufferId != null && _bufferSidecars[bufferId]) {
    words = _bufferSidecars[bufferId].words;
    _currentBufferId = bufferId;
  } else if (_sidecar) {
    words = _sidecar.words;
  } else {
    return;
  }

  var idx = wordIndexAt(words, ms);
  if (idx === _currentWordIdx) return;
  _currentWordIdx = idx;

  if (idx >= 0) {
    renderWord(words[idx].text);
  }
};

window.rsvpPause = function() {
  _paused = true;
  document.body.classList.add("paused");
};

window.rsvpResume = function() {
  _paused = false;
  document.body.classList.remove("paused");
};

window.rsvpFadeOut = function() {
  document.body.style.transition = "opacity 0.3s ease-out";
  document.body.style.opacity = "0";
};

window.rsvpFadeIn = function() {
  document.body.style.transition = "opacity 0.2s ease-out";
  document.body.style.opacity = "1";
};

// ── Init ─────────────────────────────────────────────────────────────────────

// Start with an em dash placeholder so the fixed-width layout is visible
renderWord("—");
</script>
</body>
</html>
