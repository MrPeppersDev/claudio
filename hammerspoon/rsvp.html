<!DOCTYPE html>
<!--
  rsvp.html — single-word RSVP display for Claudio balloon.

  Loaded by rsvp.lua into an hs.webview. Lua drives it via evaluateJavaScript:
    window.rsvpLoad(sidecar_json_string)   -- parse + store sidecar
    window.rsvpShowAt(ms)                  -- render word at playhead position
    window.rsvpPause()                     -- show pause indicator
    window.rsvpResume()                    -- remove pause indicator
    window.rsvpFadeOut()                   -- fade to 0 opacity (~300ms)

  ORP (Optimal Recognition Point) heuristic (Spritz-style):
    Strip trailing punctuation for length calculation.
    pivot_index = min(max(1, ceil((L-1)/4)), L-1)   (1-based)
    The pivot character is rendered in red; the full word including
    punctuation is displayed. Left-pad keeps the pivot column fixed
    regardless of word length so words don't jitter horizontally.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    /* transition managed in JS so we can coordinate with Lua animation */
    transition: opacity 0.3s ease-out;
  }

  /* Balloon background pill */
  #balloon {
    position: relative;
    width: 100%;
    height: 100%;
    background: rgba(20, 20, 22, 0.92);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* subtle border so the balloon reads against any desktop */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
    gap: 6px;
  }

  /*
    Word display. Fixed-width monospace-like layout to prevent jitter.
    We use a two-span approach:
      #word-left  — characters before the pivot, right-aligned, fixed width
      #word-pivot — the ORP character, colored red, fixed width
      #word-right — characters after the pivot, left-aligned, fixed width
    All three sit on one baseline inside a flex row.
  */
  #word-row {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    /* 48px per "slot" × some reasonable max width; clip overflow */
    width: 460px;
    overflow: hidden;
  }

  #word-left {
    flex: 0 0 200px;       /* fixed left partition */
    text-align: right;
    font-size: 52px;
    font-weight: 500;
    color: #e8e8e8;
    letter-spacing: -0.5px;
    line-height: 1.1;
    white-space: nowrap;
  }

  #word-pivot {
    flex: 0 0 42px;        /* fixed pivot column */
    text-align: center;
    font-size: 52px;
    font-weight: 600;
    color: #ff3b30;        /* system red */
    letter-spacing: -0.5px;
    line-height: 1.1;
    white-space: nowrap;
  }

  #word-right {
    flex: 1;               /* take remaining space */
    text-align: left;
    font-size: 52px;
    font-weight: 500;
    color: #e8e8e8;
    letter-spacing: -0.5px;
    line-height: 1.1;
    white-space: nowrap;
  }

  /* Vertical ORP guide line — subtle, helps the eye lock onto the pivot */
  #orp-guide {
    position: absolute;
    left: calc(200px + 21px);  /* center of pivot column: word-left.width + pivot.width/2 */
    top: 10%;
    bottom: 10%;
    width: 1px;
    background: rgba(255, 59, 48, 0.25);
    border-radius: 1px;
    pointer-events: none;
  }
  /* Horizontal baseline guide */
  #base-guide {
    position: absolute;
    left: 20px;
    right: 20px;
    height: 1px;
    background: rgba(255,255,255,0.06);
    pointer-events: none;
    /* vertically centered, but offset slightly above center for cap-height */
    top: calc(50% + 16px);
  }

  /* Pause overlay */
  #pause-indicator {
    display: none;
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* When paused, dim the word slightly */
  body.paused #word-left,
  body.paused #word-right,
  body.paused #word-pivot {
    opacity: 0.45;
  }
  body.paused #pause-indicator {
    display: block;
  }

  /* Initial invisible state — Lua fades in via opacity style */
  body {
    opacity: 0;
  }
</style>
</head>
<body>
<div id="balloon">
  <div id="orp-guide"></div>
  <div id="base-guide"></div>
  <div id="word-row">
    <span id="word-left"></span>
    <span id="word-pivot"></span>
    <span id="word-right"></span>
  </div>
  <div id="pause-indicator">paused</div>
</div>

<script>
"use strict";

// ── State ────────────────────────────────────────────────────────────────────

var _sidecar = null;          // parsed sidecar JSON (words array)
var _currentWordIdx = -1;     // index into _sidecar.words of the current word
var _paused = false;

// Buffer-id → sidecar map (for multi-buffer sessions fed by PR 4)
var _bufferSidecars = {};
var _currentBufferId = null;

// ── ORP helpers ──────────────────────────────────────────────────────────────

/**
 * Strip trailing punctuation characters from a string for length calculation.
 * The characters we strip: . , ! ? : ; " ' ) ] }
 */
function stripTrailingPunct(s) {
  return s.replace(/[.,!?:;"'\)\]}’”]+$/, "");
}

/**
 * Compute the 0-based ORP pivot index for a word string.
 * Uses the stripped form for length, but the pivot maps into the *full* string.
 *
 * Heuristic: pivot_index (1-based) = min(max(1, ceil((L-1)/4)), L-1)
 *            where L = stripped word length
 * Returns 0-based index into the full word string.
 */
function orpIndex(word) {
  var stripped = stripTrailingPunct(word);
  var L = stripped.length;
  if (L === 0) return 0;
  if (L === 1) return 0;
  // 1-based index in stripped string
  var idx1 = Math.min(Math.max(1, Math.ceil((L - 1) / 4)), L - 1);
  // Convert to 0-based
  return idx1 - 1;
}

// ── Word rendering ───────────────────────────────────────────────────────────

function renderWord(word) {
  if (!word || word === "") {
    document.getElementById("word-left").textContent  = "";
    document.getElementById("word-pivot").textContent = "";
    document.getElementById("word-right").textContent = "";
    return;
  }

  var pivot = orpIndex(word);

  // Split into three parts: before pivot, pivot char, after pivot
  var before = word.substring(0, pivot);
  var pivotChar = word.substring(pivot, pivot + 1);
  var after = word.substring(pivot + 1);

  document.getElementById("word-left").textContent  = before;
  document.getElementById("word-pivot").textContent = pivotChar;
  document.getElementById("word-right").textContent = after;
}

// ── Sidecar binary search ────────────────────────────────────────────────────

/**
 * Find the index of the word whose [start_ms, end_ms) range contains `ms`.
 * Returns -1 if no word covers `ms`.
 * Uses binary search since the words array can be several hundred entries.
 */
function wordIndexAt(words, ms) {
  if (!words || words.length === 0) return -1;
  var lo = 0, hi = words.length - 1;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    var w = words[mid];
    if (ms < w.start_ms) {
      hi = mid - 1;
    } else if (ms >= w.end_ms) {
      lo = mid + 1;
    } else {
      return mid;
    }
  }
  // ms fell in a gap between words — show the nearest upcoming word
  if (lo < words.length) return lo;
  return -1;
}

// ── Public JS API (called by Lua via evaluateJavaScript) ─────────────────────

/**
 * rsvpLoad(sidecar_json_string)
 * Parse and store a sidecar. Resets current word to -1.
 */
window.rsvpLoad = function(jsonString) {
  try {
    _sidecar = JSON.parse(jsonString);
    _currentWordIdx = -1;
    _currentBufferId = null;
    renderWord("");
  } catch(e) {
    console.error("rsvpLoad: parse error", e);
  }
};

/**
 * rsvpLoadBuffer(buffer_id, sidecar_json_string)
 * Register a sidecar for a specific buffer id.
 */
window.rsvpLoadBuffer = function(bufferId, jsonString) {
  try {
    _bufferSidecars[bufferId] = JSON.parse(jsonString);
  } catch(e) {
    console.error("rsvpLoadBuffer: parse error for buffer", bufferId, e);
  }
};

/**
 * rsvpShowAt(ms, buffer_id)
 * Advance the display to the word at position `ms` in the given buffer's sidecar.
 * If buffer_id is omitted or null, uses the top-level _sidecar.
 * No-ops if the resolved word index is the same as the current one.
 */
window.rsvpShowAt = function(ms, bufferId) {
  if (_paused) return;

  var words;
  if (bufferId != null && _bufferSidecars[bufferId]) {
    words = _bufferSidecars[bufferId].words;
    _currentBufferId = bufferId;
  } else if (_sidecar) {
    words = _sidecar.words;
  } else {
    return;
  }

  var idx = wordIndexAt(words, ms);
  if (idx === _currentWordIdx) return;   // same word, skip re-render
  _currentWordIdx = idx;

  if (idx >= 0) {
    renderWord(words[idx].text);
  }
};

/**
 * rsvpPause()
 * Dim the word and show the pause indicator.
 */
window.rsvpPause = function() {
  _paused = true;
  document.body.classList.add("paused");
};

/**
 * rsvpResume()
 * Remove pause indicator and resume advancing on next rsvpShowAt call.
 */
window.rsvpResume = function() {
  _paused = false;
  document.body.classList.remove("paused");
};

/**
 * rsvpFadeOut()
 * Fade the entire body to opacity 0 over ~300ms. Lua polls or uses a timer
 * to destroy the webview after the transition completes.
 */
window.rsvpFadeOut = function() {
  document.body.style.transition = "opacity 0.3s ease-out";
  document.body.style.opacity = "0";
};

/**
 * rsvpFadeIn()
 * Fade in after the webview is shown (called once by Lua on show).
 */
window.rsvpFadeIn = function() {
  document.body.style.transition = "opacity 0.2s ease-out";
  document.body.style.opacity = "1";
};

// ── Init ─────────────────────────────────────────────────────────────────────

// Start with an em dash placeholder so the fixed-width layout is visible
renderWord("—");
</script>
</body>
</html>
